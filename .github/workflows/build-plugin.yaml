#
#  build-plugin.yaml
#  SynesthesiaVibeOBS
#
#  Created by lee5783 on 2026-11-23.
#

name: Build Plugin

on:
  workflow_call:
    inputs:
      config:
        description: CMake configuration, RelWithDebInfo or Release
        type: string
        default: RelWithDebInfo
      sign:
        description: Sign with Developer ID and notarize the macOS package (needs the macos-signing environment)
        type: boolean
        default: false

permissions:
  contents: read

env:
  VCPKG_COMMIT: 5f96cd15fd745122cf27e0524606d6c1efc5fd07

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-26
    timeout-minutes: 120
    environment: ${{ inputs.sign && 'macos-signing' || '' }}
    env:
      CONFIG: ${{ inputs.config }}
      SIGN: ${{ inputs.sign }}
      XCODE_APP: /Applications/Xcode_26.6.app
    defaults:
      run:
        shell: bash
        working-directory: plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up environment
        id: setup
        run: |
          case "${CONFIG}" in
            RelWithDebInfo | Release) ;;
            *) echo "::error::config must be RelWithDebInfo or Release, got '${CONFIG}'"; exit 1 ;;
          esac
          sudo xcode-select --switch "${XCODE_APP}/Contents/Developer"
          xcodebuild -version
          cmake --version | head -n 1
          echo "ninja $(ninja --version)"
          name="$(jq -r .name buildspec.json)"
          version="$(jq -r .version buildspec.json)"
          if [[ ! "${name}" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::plugin/buildspec.json name '${name}' must match ^[a-z0-9-]+$"
            exit 1
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::plugin/buildspec.json version '${version}' must be X.Y.Z"
            exit 1
          fi
          {
            echo "VCPKG_ROOT=${RUNNER_TEMP}/vcpkg"
            echo "VCPKG_DEFAULT_BINARY_CACHE=${RUNNER_TEMP}/vcpkg-archives"
            echo "ASSET_BASE=${name}-${version}"
          } >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/vcpkg-archives"
          {
            echo "name=${name}"
            echo "version=${version}"
            echo "core=$(git rev-parse HEAD:external/synesthesia-vibe)"
            echo "xcode=$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          } >> "${GITHUB_OUTPUT}"

      - name: Restore OBS dependencies
        id: deps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: plugin/.deps
          key: obs-deps-macos-arm64-xcode${{ steps.setup.outputs.xcode }}-${{ hashFiles('plugin/buildspec.json') }}

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-macos-arm64-osx-${{ env.VCPKG_COMMIT }}-${{ steps.setup.outputs.core }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-macos-arm64-osx-${{ env.VCPKG_COMMIT }}-${{ steps.setup.outputs.core }}-
            vcpkg-macos-arm64-osx-${{ env.VCPKG_COMMIT }}-

      - name: Count restored vcpkg archives
        id: vcpkg-restored
        run: |
          count="$(find "${VCPKG_DEFAULT_BINARY_CACHE}" -type f -name '*.zip' | wc -l | tr -d ' ')"
          echo "restored vcpkg binary archives: ${count}"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"

      - name: Set up vcpkg
        run: |
          git init --quiet "${VCPKG_ROOT}"
          git -C "${VCPKG_ROOT}" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "${VCPKG_ROOT}" fetch --quiet --depth 1 origin "${VCPKG_COMMIT}"
          git -C "${VCPKG_ROOT}" checkout --quiet FETCH_HEAD
          "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics

      - name: Import signing certificate
        if: inputs.sign
        env:
          MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          if [[ -z "${MACOS_SIGNING_CERT}" || -z "${MACOS_SIGNING_CERT_PASSWORD}" ]]; then
            echo "::error::signing needs the MACOS_SIGNING_CERT and MACOS_SIGNING_CERT_PASSWORD secrets in the macos-signing environment"
            exit 1
          fi
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::${keychain_password}"
          certificate="${RUNNER_TEMP}/signing.p12"
          printf '%s' "${MACOS_SIGNING_CERT}" | base64 --decode > "${certificate}"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${certificate}" -k "${keychain}" -f pkcs12 -P "${MACOS_SIGNING_CERT_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/security
          rm -f "${certificate}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain}" > /dev/null
          existing_keychains=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            existing_keychains+=("${line//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychain}" "${existing_keychains[@]}"
          identities="$(security find-identity -v -p basic "${keychain}")"
          application_identities="$(grep -o '"Developer ID Application: [^"]*"' <<< "${identities}" | tr -d '"' | sort -u || true)"
          installer_identities="$(grep -o '"Developer ID Installer: [^"]*"' <<< "${identities}" | tr -d '"' | sort -u || true)"
          if [[ "$(grep -c . <<< "${application_identities}")" != "1" || "$(grep -c . <<< "${installer_identities}")" != "1" ]]; then
            echo "::error::the certificate file must hold exactly one Developer ID Application and one Developer ID Installer identity"
            echo "${identities}"
            exit 1
          fi
          team="${application_identities##*(}"
          team="${team%)}"
          if [[ ! "${team}" =~ ^[A-Z0-9]{10}$ || "${installer_identities}" != *"(${team})" ]]; then
            echo "::error::could not read one team ID shared by both identities"
            exit 1
          fi
          echo "application identity: ${application_identities}"
          echo "installer identity: ${installer_identities}"
          {
            echo "SIGNING_KEYCHAIN=${keychain}"
            echo "CODESIGN_IDENT=${application_identities}"
            echo "CODESIGN_TEAM=${team}"
            echo "INSTALLER_IDENT=${installer_identities}"
          } >> "${GITHUB_ENV}"

      - name: Configure
        run: cmake --preset macos-arm64

      - name: Save OBS dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: plugin/.deps
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build --preset macos-arm64 --config "${CONFIG}"

      - name: Check vcpkg binary cache
        id: vcpkg-archives
        if: ${{ !cancelled() }}
        env:
          RESTORED: ${{ steps.vcpkg-restored.outputs.count }}
        run: |
          count=0
          if [[ -d "${VCPKG_DEFAULT_BINARY_CACHE:-}" ]]; then
            count="$(find "${VCPKG_DEFAULT_BINARY_CACHE}" -type f -name '*.zip' | wc -l | tr -d ' ')"
          fi
          echo "vcpkg binary archives: ${count} (restored ${RESTORED:-0})"
          if (( count > ${RESTORED:-0} )); then
            echo "save=true" >> "${GITHUB_OUTPUT}"
          else
            echo "save=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && steps.vcpkg-archives.outputs.save == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Package
        run: |
          rm -rf build_macos_arm64/package-staging
          cmake --install build_macos_arm64 --config "${CONFIG}" --prefix build_macos_arm64/package-staging

      - name: Sign and notarize
        if: inputs.sign
        working-directory: plugin/build_macos_arm64/package-staging
        env:
          MACOS_NOTARIZATION_USERNAME: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
        run: |
          if [[ -z "${MACOS_NOTARIZATION_USERNAME}" || -z "${MACOS_NOTARIZATION_PASSWORD}" ]]; then
            echo "::error::notarization needs the MACOS_NOTARIZATION_USERNAME and MACOS_NOTARIZATION_PASSWORD secrets in the macos-signing environment"
            exit 1
          fi
          productsign --timestamp --keychain "${SIGNING_KEYCHAIN}" --sign "${INSTALLER_IDENT}" \
            synesthesia-vibe-obs.pkg synesthesia-vibe-obs-signed.pkg
          mv synesthesia-vibe-obs-signed.pkg synesthesia-vibe-obs.pkg
          pkgutil --check-signature synesthesia-vibe-obs.pkg
          xcrun notarytool submit synesthesia-vibe-obs.pkg \
            --apple-id "${MACOS_NOTARIZATION_USERNAME}" --password "${MACOS_NOTARIZATION_PASSWORD}" --team-id "${CODESIGN_TEAM}" \
            --wait --timeout 45m --output-format json > notary-result.json || true
          cat notary-result.json
          submission_id="$(jq -r '.id // empty' notary-result.json)"
          status="$(jq -r '.status // empty' notary-result.json)"
          if [[ "${status}" != "Accepted" ]]; then
            if [[ -n "${submission_id}" ]]; then
              xcrun notarytool log "${submission_id}" \
                --apple-id "${MACOS_NOTARIZATION_USERNAME}" --password "${MACOS_NOTARIZATION_PASSWORD}" --team-id "${CODESIGN_TEAM}" || true
            fi
            echo "::error::notarization status '${status:-none}'"
            exit 1
          fi
          rm -f notary-result.json
          xcrun stapler staple synesthesia-vibe-obs.pkg
          if ! xcrun stapler staple synesthesia-vibe-obs.plugin; then
            echo "::warning::the notarization ticket could not be stapled to the .plugin bundle; Gatekeeper checks it online"
          fi

      - name: Archive
        working-directory: plugin/build_macos_arm64/package-staging
        run: |
          ditto -c -k --norsrc --noextattr --keepParent synesthesia-vibe-obs.plugin "${ASSET_BASE}-macos-arm64.zip"
          mv synesthesia-vibe-obs.pkg "${ASSET_BASE}-macos-arm64.pkg"
          ls -l "${ASSET_BASE}-macos-arm64.pkg" "${ASSET_BASE}-macos-arm64.zip"

      - name: Inspect package
        working-directory: plugin/build_macos_arm64/package-staging
        run: |
          bundle=synesthesia-vibe-obs.plugin
          binary="${bundle}/Contents/MacOS/synesthesia-vibe-obs"
          pkg="${ASSET_BASE}-macos-arm64.pkg"
          zip="${ASSET_BASE}-macos-arm64.zip"
          expected_exports="${GITHUB_WORKSPACE}/plugin/exported-symbols.txt"

          echo "::group::Distribution"
          rm -rf expanded-pkg
          pkgutil --expand "${pkg}" expanded-pkg
          grep -F 'hostArchitectures="arm64"' expanded-pkg/Distribution
          rm -rf expanded-pkg
          echo "::endgroup::"

          echo "::group::Architecture"
          lipo_info="$(lipo -info "${binary}")"
          echo "${lipo_info}"
          if [[ "${lipo_info}" != "Non-fat file: "*" is architecture: arm64" ]]; then
            echo "::error::binary is not arm64 only: ${lipo_info}"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Exports"
          nm -gU "${binary}" | awk '{ print $3 }' | sort > exports-actual.txt
          grep '^_obs_module_' "${expected_exports}" | sort > exports-expected.txt
          cat exports-actual.txt
          if ! diff -u exports-expected.txt exports-actual.txt; then
            echo "::error::exports differ from plugin/exported-symbols.txt"
            exit 1
          fi
          export_count="$(wc -l < exports-actual.txt | tr -d ' ')"
          if [[ "${export_count}" != "7" ]]; then
            echo "::error::expected 7 exports, found ${export_count}"
            exit 1
          fi
          rm -f exports-actual.txt exports-expected.txt
          echo "::endgroup::"

          echo "::group::Bundle version"
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${bundle}/Contents/Info.plist")"
          echo "CFBundleVersion ${bundle_version}"
          if [[ "${bundle_version}" != "${GITHUB_RUN_ID}" ]]; then
            echo "::error::CFBundleVersion ${bundle_version} is not the run id ${GITHUB_RUN_ID}"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Code signature"
          codesign -dvv "${bundle}" 2>&1 | tee codesign-details.txt
          if [[ "${SIGN}" == "true" ]]; then
            for expected in "^Authority=Developer ID Application: " "^TeamIdentifier=${CODESIGN_TEAM}\$" "^Timestamp=" "flags=0x[0-9a-f]+\(runtime\)"; do
              if ! grep -E -q "${expected}" codesign-details.txt; then
                echo "::error::bundle signature lacks '${expected}'"
                exit 1
              fi
            done
            spctl --assess -vv --type install "${pkg}" 2>&1 | tee spctl-details.txt
            if ! grep -q 'source=Notarized Developer ID' spctl-details.txt; then
              echo "::error::Gatekeeper does not accept the pkg as notarized"
              exit 1
            fi
            xcrun stapler validate "${pkg}"
            rm -f spctl-details.txt
          elif ! grep -q '^Signature=adhoc$' codesign-details.txt; then
            echo "::error::bundle is not ad-hoc signed"
            exit 1
          fi
          rm -f codesign-details.txt
          codesign --verify --deep --strict --verbose=2 "${bundle}"
          echo "::endgroup::"

          echo "::group::Payload"
          pkgutil --payload-files "${pkg}" | tee payload.txt
          if grep -E -i '\.milk$|/presets?(/|$)|/textures?(/|$)' payload.txt; then
            echo "::error::the pkg payload contains presets or textures"
            exit 1
          fi
          rm -f payload.txt
          unzip -Z1 "${zip}" | tee zip-entries.txt
          if grep -v '^synesthesia-vibe-obs\.plugin/' zip-entries.txt; then
            echo "::error::the zip holds entries outside the bundle"
            exit 1
          fi
          if grep -E -i '\.milk$|/presets?(/|$)|/textures?(/|$)|(^|/)\._' zip-entries.txt; then
            echo "::error::the zip contains presets, textures or AppleDouble entries"
            exit 1
          fi
          rm -f zip-entries.txt
          echo "::endgroup::"

      - name: Upload macOS packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.setup.outputs.name }}-${{ steps.setup.outputs.version }}-macos-arm64
          path: |
            plugin/build_macos_arm64/package-staging/${{ steps.setup.outputs.name }}-${{ steps.setup.outputs.version }}-macos-arm64.pkg
            plugin/build_macos_arm64/package-staging/${{ steps.setup.outputs.name }}-${{ steps.setup.outputs.version }}-macos-arm64.zip
          if-no-files-found: error

      - name: Remove signing keychain
        if: ${{ always() && inputs.sign }}
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" && -f "${SIGNING_KEYCHAIN}" ]]; then
            security delete-keychain "${SIGNING_KEYCHAIN}"
          fi

  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CONFIG: ${{ inputs.config }}
    defaults:
      run:
        shell: bash
        working-directory: plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up environment
        id: setup
        run: |
          case "${CONFIG}" in
            RelWithDebInfo | Release) ;;
            *) echo "::error::config must be RelWithDebInfo or Release, got '${CONFIG}'"; exit 1 ;;
          esac
          name="$(jq -r .name buildspec.json)"
          version="$(jq -r .version buildspec.json)"
          if [[ ! "${name}" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::plugin/buildspec.json name '${name}' must match ^[a-z0-9-]+$"
            exit 1
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::plugin/buildspec.json version '${version}' must be X.Y.Z"
            exit 1
          fi
          {
            echo "VCPKG_ROOT=${RUNNER_TEMP}/vcpkg"
            echo "VCPKG_DEFAULT_BINARY_CACHE=${RUNNER_TEMP}/vcpkg-archives"
            echo "ASSET_BASE=${name}-${version}"
          } >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/vcpkg-archives"
          {
            echo "name=${name}"
            echo "version=${version}"
            echo "core=$(git rev-parse HEAD:external/synesthesia-vibe)"
          } >> "${GITHUB_OUTPUT}"

      - name: Install build dependencies
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo add-apt-repository --yes --no-update ppa:obsproject/obs-studio
          for attempt in 1 2 3 4 5; do
            if sudo apt-get update --error-on=any; then
              break
            fi
            if [[ "${attempt}" == "5" ]]; then
              echo "::error::apt-get update failed 5 times; ppa:obsproject/obs-studio or an Ubuntu mirror is unreachable"
              exit 1
            fi
            echo "apt-get update failed (attempt ${attempt}), retrying in $((attempt * 20)) s"
            sleep "$((attempt * 20))"
          done
          apt-cache policy obs-studio
          candidate="$(apt-cache policy obs-studio | awk '/Candidate:/ { print $2 }')"
          if [[ "${candidate}" != *obsproject* ]]; then
            echo "::error::obs-studio candidate '${candidate}' is not from ppa:obsproject/obs-studio; refusing to build against the distro OBS"
            exit 1
          fi
          packages=(
            autoconf
            autoconf-archive
            automake
            bison
            build-essential
            curl
            flex
            gettext
            gperf
            libegl-dev
            libgl-dev
            libgles2-mesa-dev
            libglu1-mesa-dev
            libltdl-dev
            libopengl-dev
            libsimde-dev
            libtool
            libxcursor-dev
            libxinerama-dev
            libxkbcommon-dev
            libxml2-utils
            make
            ninja-build
            obs-studio
            pkg-config
            python3
            tar
            unzip
            xorg-dev
            xsltproc
            zip
          )
          for attempt in 1 2 3; do
            if sudo apt-get install -y --no-install-recommends "${packages[@]}"; then
              break
            fi
            if [[ "${attempt}" == "3" ]]; then
              echo "::error::apt-get install failed 3 times; ppa:obsproject/obs-studio or an Ubuntu mirror is unreachable"
              exit 1
            fi
            echo "apt-get install failed (attempt ${attempt}), retrying in $((attempt * 30)) s"
            sleep "$((attempt * 30))"
          done
          gcc --version | head -n 1
          cmake --version | head -n 1
          echo "ninja $(ninja --version)"

      - name: Record libobs version
        run: |
          obs_package="$(dpkg-query -W -f='${Package} ${Version}' obs-studio)"
          if [[ "${obs_package}" != *obsproject* ]]; then
            echo "::error::installed ${obs_package} is not from ppa:obsproject/obs-studio"
            exit 1
          fi
          config_header="$(dpkg-query -S '*/obs-config.h' 2>/dev/null | awk -F ': ' '{ print $2; exit }' || true)"
          if [[ -z "${config_header}" || ! -f "${config_header}" ]]; then
            echo "::error::no installed package provides obs-config.h; libobs development headers are missing"
            dpkg-query -W -f='${Package} ${Version}\n' | grep -i obs || true
            exit 1
          fi
          api_version="$(awk '/#define LIBOBS_API_(MAJOR|MINOR|PATCH)_VER/ { printf "%s%s", sep, $3; sep = "." }' "${config_header}")"
          if [[ -z "${api_version}" ]]; then
            echo "::error::LIBOBS_API_*_VER not found in ${config_header}"
            exit 1
          fi
          echo "obs-studio package: ${obs_package}"
          echo "libobs headers: ${config_header}"
          echo "libobs API version: ${api_version}"
          {
            echo "### Linux libobs"
            echo
            echo "- obs-studio package: \`${obs_package}\`"
            echo "- libobs API version: \`${api_version}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-linux-x64-linux-${{ env.VCPKG_COMMIT }}-${{ steps.setup.outputs.core }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-linux-x64-linux-${{ env.VCPKG_COMMIT }}-${{ steps.setup.outputs.core }}-
            vcpkg-linux-x64-linux-${{ env.VCPKG_COMMIT }}-

      - name: Count restored vcpkg archives
        id: vcpkg-restored
        run: |
          count="$(find "${VCPKG_DEFAULT_BINARY_CACHE}" -type f -name '*.zip' | wc -l | tr -d ' ')"
          echo "restored vcpkg binary archives: ${count}"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"

      - name: Set up vcpkg
        run: |
          git init --quiet "${VCPKG_ROOT}"
          git -C "${VCPKG_ROOT}" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "${VCPKG_ROOT}" fetch --quiet --depth 1 origin "${VCPKG_COMMIT}"
          git -C "${VCPKG_ROOT}" checkout --quiet FETCH_HEAD
          "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: cmake --preset ubuntu-ci-x86_64 -DCMAKE_INSTALL_PREFIX=/usr "-DCMAKE_BUILD_TYPE=${CONFIG}"

      - name: Build
        run: cmake --build --preset ubuntu-ci-x86_64

      - name: Check vcpkg binary cache
        id: vcpkg-archives
        if: ${{ !cancelled() }}
        env:
          RESTORED: ${{ steps.vcpkg-restored.outputs.count }}
        run: |
          count=0
          if [[ -d "${VCPKG_DEFAULT_BINARY_CACHE:-}" ]]; then
            count="$(find "${VCPKG_DEFAULT_BINARY_CACHE}" -type f -name '*.zip' | wc -l | tr -d ' ')"
          fi
          echo "vcpkg binary archives: ${count} (restored ${RESTORED:-0})"
          if (( count > ${RESTORED:-0} )); then
            echo "save=true" >> "${GITHUB_OUTPUT}"
          else
            echo "save=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && steps.vcpkg-archives.outputs.save == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Check plugin binary
        run: |
          so=build_x86_64/synesthesia-vibe-obs.so
          if [[ ! -f "${so}" ]]; then
            echo "::error::${so} was not built"
            exit 1
          fi
          file "${so}"

          echo "::group::Exports"
          grep -E '^[[:space:]]+obs_module_[a-z_]+;$' exported-symbols.map | tr -d ' \t;' | sort > exports-expected.txt
          nm -D --defined-only "${so}" | awk '{ print $3 }' | sort > exports-defined.txt
          cat exports-defined.txt
          grep '^obs_module_' exports-defined.txt > exports-actual.txt || true
          if ! diff -u exports-expected.txt exports-actual.txt; then
            echo "::error::obs_module_* exports differ from plugin/exported-symbols.map"
            exit 1
          fi
          export_count="$(wc -l < exports-actual.txt | tr -d ' ')"
          if [[ "${export_count}" != "7" ]]; then
            echo "::error::expected 7 obs_module_* exports, found ${export_count}"
            exit 1
          fi
          if grep -v -x -E 'obs_module_[a-z_]+|_init|_fini|_edata|_end|__bss_start' exports-defined.txt; then
            echo "::error::the plugin exports symbols beyond the 7 obs_module_* entry points"
            exit 1
          fi
          if grep -i -E 'glad|^sv_|projectm|nseel|^_Z' exports-defined.txt; then
            echo "::error::glad, core, projectM or C++ symbols are exported"
            exit 1
          fi
          rm -f exports-expected.txt exports-defined.txt exports-actual.txt
          echo "::endgroup::"

          echo "::group::Dynamic section"
          readelf -d "${so}" | tee dynamic.txt
          if grep -q TEXTREL dynamic.txt; then
            echo "::error::the plugin has text relocations (non-PIC code linked in)"
            exit 1
          fi
          rm -f dynamic.txt
          echo "::endgroup::"

          echo "::group::Shared library resolution"
          ldd "${so}" | tee ldd.txt
          if grep -q 'not found' ldd.txt; then
            echo "::error::ldd reports unresolved shared libraries"
            exit 1
          fi
          rm -f ldd.txt
          echo "::endgroup::"

          echo "::group::dlopen probe"
          python3 -I - "${so}" <<'PROBE'
          import ctypes
          import os
          import sys

          library = ctypes.CDLL(os.path.abspath(sys.argv[1]), mode=os.RTLD_NOW | os.RTLD_LOCAL)
          for name in ("obs_module_load", "obs_module_unload", "obs_module_ver", "obs_module_set_pointer"):
              getattr(library, name)
          print("dlopen probe: RTLD_NOW | RTLD_LOCAL load succeeded and obs_module_load resolved")
          PROBE
          echo "::endgroup::"

      - name: Package
        run: |
          rm -rf release
          cmake --build build_x86_64 --target package
          ls -l release

      - name: Inspect package
        run: |
          deb="release/${ASSET_BASE}-x86_64-linux-gnu.deb"
          if [[ ! -f "${deb}" ]]; then
            echo "::error::${deb} was not produced"
            exit 1
          fi

          echo "::group::Control"
          dpkg-deb -I "${deb}"
          maintainer="$(dpkg-deb -f "${deb}" Maintainer)"
          depends="$(dpkg-deb -f "${deb}" Depends)"
          echo "Maintainer: ${maintainer}"
          echo "Depends: ${depends}"
          if [[ -z "${maintainer}" ]]; then
            echo "::error::the package has no Maintainer"
            exit 1
          fi
          if [[ "${depends}" != *obs* ]]; then
            echo "::error::Depends does not name the OBS package"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Contents"
          dpkg-deb -c "${deb}" | tee deb-contents.txt
          if ! grep -q -E ' \./usr/lib/x86_64-linux-gnu/obs-plugins/synesthesia-vibe-obs\.so$' deb-contents.txt; then
            echo "::error::the plugin .so is not under /usr/lib/x86_64-linux-gnu/obs-plugins/"
            exit 1
          fi
          if ! grep -q -E ' \./usr/share/obs/obs-plugins/synesthesia-vibe-obs/locale/en-US\.ini$' deb-contents.txt; then
            echo "::error::locale/en-US.ini is not under /usr/share/obs/obs-plugins/synesthesia-vibe-obs/"
            exit 1
          fi
          if grep -E -i '\.milk$|/presets?(/|$)|/textures?(/|$)' deb-contents.txt; then
            echo "::error::the package contains presets or textures"
            exit 1
          fi
          rm -f deb-contents.txt
          echo "::endgroup::"

          echo "::group::Packaged binary exports"
          rm -rf deb-root
          dpkg-deb -x "${deb}" deb-root
          nm -D --defined-only deb-root/usr/lib/x86_64-linux-gnu/obs-plugins/synesthesia-vibe-obs.so | awk '{ print $3 }' | grep '^obs_module_' | sort > packaged-exports.txt
          cat packaged-exports.txt
          packaged_count="$(wc -l < packaged-exports.txt | tr -d ' ')"
          if [[ "${packaged_count}" != "7" ]]; then
            echo "::error::the packaged .so exports ${packaged_count} obs_module_* names, expected 7"
            exit 1
          fi
          rm -rf deb-root packaged-exports.txt
          echo "::endgroup::"

      - name: Upload Linux package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.setup.outputs.name }}-${{ steps.setup.outputs.version }}-x86_64-linux-gnu
          path: plugin/release/${{ steps.setup.outputs.name }}-${{ steps.setup.outputs.version }}-x86_64-linux-gnu.deb
          if-no-files-found: error
